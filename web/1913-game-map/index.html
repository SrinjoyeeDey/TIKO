<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WORLD — 1913</title>
    <!-- Vintage serif fonts for that historical feel -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- D3.js is used to draw the SVG world map smoothly -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <div class="map-container">
        <!-- Decorative Vintage Border -->
        <div class="vintage-border"></div>
        
        <!-- Main Map Title -->
        <div class="map-title">
            <h1>THE WORLD</h1>
            <p>— 1913 —</p>
        </div>

        <!-- SVG Map Area -->
        <svg id="world-map"></svg>

        <!-- Dynamic Game UI Popup -->
        <div id="location-popup" class="hidden">
            <div class="popup-content">
                <h2 id="popup-title">City</h2>
                <p id="popup-desc">Description</p>
                <button id="popup-enter-btn" onclick="enterLocation()">ENTER</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
